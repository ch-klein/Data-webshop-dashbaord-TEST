<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'sha256-wRQD32UuG+AFfDLQqA11c2BsHy3Kmhm9b6zS40Vbn+4='; script-src 'sha256-4r3PiFzoqacVT/8utQ613nhjk1V1ZSBxQryxPW/z/88='; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Demo Fietsenwinkel (voorbeeld) · Dashboard</title>
<style>/* Dashboard (lay-out: donkere zijbalk, topbalk, tegels met pictogram, panelen met uitklapknop). Kleuren komen als variabelen uit het thema. */
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
.shell{display:flex;min-height:100vh}

/* zijbalk */
.side{flex:0 0 236px;width:236px;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.side-brand{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--side-line);font-weight:800;font-size:17px;letter-spacing:.02em;overflow:hidden}
.side-brand img{max-height:32px;max-width:190px;width:auto;height:auto;display:block}
.nav-list{display:flex;flex-direction:column;padding:6px 0;flex:1;overflow:auto}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;background:none;border:0;border-left:4px solid transparent;color:var(--side-text);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.nav:hover{background:var(--side-active)}
.nav.on{background:var(--side-active);border-left-color:var(--side-accent);font-weight:700}
.nav:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.nav svg{flex:0 0 20px;opacity:.9}
.side-foot{padding:12px 18px;font-size:12px;color:var(--side-muted);border-top:1px solid var(--side-line)}
.scrim{display:none}

/* hoofdgedeelte */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;background:var(--side-bg);color:var(--side-text);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;position:sticky;top:0;z-index:30}
.burger{display:none;background:none;border:0;color:var(--side-text);padding:6px;cursor:pointer}
.bar-name{font-weight:700;display:none}
.selbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--side-line);border-radius:8px;color:var(--side-text);font:inherit;font-size:14px;padding:7px 12px;cursor:pointer;max-width:100%;text-align:left}
.selbtn:hover{background:var(--side-active)}
.selbtn:focus-visible,.burger:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.selbtn .lab{color:var(--side-muted)}
.selbtn .lab::after{content:":"}
.selbtn span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selpanel{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px}
.selpanel[hidden]{display:none}
.pagehead{padding:20px 24px 4px}
.pagehead h1{font-size:30px;font-weight:300;margin:0;line-height:1.2}
.pagehead h1 small{font-size:15px;color:var(--muted);font-weight:400;margin-left:6px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin:14px 0 4px}
.crumbs svg{opacity:.7}
.content{padding:8px 24px 24px}
.footer{color:var(--muted);font-size:12px;margin:8px 24px 18px;text-align:center}

/* tegels en panelen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:12px 0 14px}
.kpi{position:relative;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px 16px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;order:2}
.kpi .v{font-size:30px;font-weight:300;color:var(--primary-text);line-height:1.15;margin:2px 0 4px}
.kpi .v.neg{color:var(--bad)}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .ic{position:absolute;right:14px;top:14px;color:var(--muted);opacity:.55}
.pos{color:var(--good)}.neg{color:var(--bad)}
.kpi .d.pos b{color:var(--good)}.kpi .d.neg b{color:var(--bad)}.kpi .d b{font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}
.ph h2{font-size:16px;margin:0;color:var(--primary-text);text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.ph .controls{margin:0}
.ph .tools{display:flex;align-items:center;gap:10px;margin-left:auto}
.xbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;padding:0}
.xbtn:hover{color:var(--text);border-color:var(--primary)}
.xbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.expanded{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;margin:0;border-radius:0;overflow:auto;padding:24px}
body.noscroll{overflow:hidden}
h3{font-size:14px;margin:16px 0 6px;color:var(--text)}

/* besturing, tabellen, grafieken */
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px}
.field{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
select{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 10px;min-width:150px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;margin:6px 0}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
td.num,th:not(:first-child){text-align:right}
td.num{white-space:nowrap}td.txt{text-align:left}td.strong{font-weight:700}td.new{color:var(--primary-text);font-weight:600}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--page)}tr.pick:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
tr.pick.on td{background:var(--page);font-weight:600}tr.total td{font-weight:700;border-top:2px solid var(--border)}
.absent{color:var(--muted);font-style:italic}
.chart svg{display:block;width:100%;height:auto}
.bar{fill:var(--muted);opacity:.35}
.bar.sel{fill:var(--primary);opacity:1}.bar.cmp{fill:var(--accent);opacity:1}.bar.fc{fill:var(--accent);opacity:.75}
.whisker{stroke:var(--text);stroke-width:2}
.axis{fill:var(--muted);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 2px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--muted);opacity:.35}
.sw.sel{background:var(--primary);opacity:1}.sw.cmp{background:var(--accent);opacity:1}
.sw.fc{background:var(--accent);opacity:.75}.sw.wh{background:none;border-left:2px solid var(--text);border-radius:0;width:2px;opacity:1}
.s0{fill:var(--c0)}.s1{fill:var(--c1)}.s2{fill:var(--c2)}.s3{fill:var(--c3)}.s4{fill:var(--c4)}.s5{fill:var(--c5)}
.sw.s0{background:var(--c0);opacity:1}.sw.s1{background:var(--c1);opacity:1}.sw.s2{background:var(--c2);opacity:1}
.sw.s3{background:var(--c3);opacity:1}.sw.s4{background:var(--c4);opacity:1}.sw.s5{background:var(--c5);opacity:1}
.mk.sel{fill:var(--primary)}.mk.cmp{fill:var(--accent)}
.spark{display:block;width:110px;height:28px}.spark polyline{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:6px 0}
.notes .note{margin:4px 0}
.muted{color:var(--muted)}
.warn{border-left:4px solid var(--bad);background:var(--card);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13.5px}
ul{margin:4px 0 0 18px;padding:0}li{margin:3px 0;overflow-wrap:anywhere}
.detail{margin-top:10px}.detail h3{margin:10px 0 4px}
.close{font:inherit;font-size:13px;color:var(--primary-text);background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.pill{font:inherit;font-size:13.5px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer}
.pill:hover{border-color:var(--primary)}.pill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kw-search{width:100%;max-width:420px;font:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.kw-search:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:13px;color:var(--on-primary);background:var(--primary);border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* smalle schermen: zijbalk wordt een uitschuifmenu */
@media (max-width:900px){
  .side{position:fixed;left:-260px;top:0;width:250px;flex:none;height:100vh;transition:left .2s}
  .side.open{left:0}
  .scrim.on{display:block;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:35}
  .burger{display:inline-flex}.bar-name{display:block;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selbtn span.txt{display:none}.selbtn .lab::after{content:""}.selbtn .lab{color:var(--side-text);font-weight:600}.selbtn{flex:0 1 auto;min-width:0}
  .selpanel{padding:10px 14px}.pagehead{padding:14px 14px 0}.content{padding:6px 14px 18px}.pagehead h1{font-size:24px}
  .footer{margin:8px 14px 16px}
}
@media (max-width:560px){
  th{text-transform:none;font-size:11px;letter-spacing:0}
  .kpi .v{font-size:24px}th,td{padding:6px 4px;font-size:13px}select{min-width:0;width:100%}.field{flex:1 1 140px}
  .crumbs{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}


/* toegankelijkheid */
tbody th{font-size:14px;text-transform:none;letter-spacing:0;color:inherit;font-weight:400;text-align:left}
tr.total th{font-weight:700}
.rowbtn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.rowbtn:hover{text-decoration:underline}
.rowbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--card);color:var(--text);border:2px solid var(--primary);border-radius:6px;padding:8px 14px;font:inherit}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main.content:focus{outline:none}
.pagehead h1:focus{outline:none}
@supports not selector(:focus-visible){
  .nav:focus,.selbtn:focus,.burger:focus,.xbtn:focus,.pill:focus,.chip:focus,.rowbtn:focus,select:focus,.kw-search:focus{outline:3px solid var(--accent);outline-offset:2px}
}

/* weergave Kaarten: cijfertegels en grafieken met meerdere reeksen */
.pbi-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pbi-tile{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;text-align:center}
.pbi-tile .l{text-align:left;font-size:15px;color:var(--text)}
.pbi-tile .v{font-size:34px;font-weight:300;line-height:1.3;margin:8px 0 4px;color:var(--primary-text)}
.pbi-tile .v.pos{color:var(--good)}
.pbi-tile .v.neg{color:var(--bad)}
.pbi-tile .d{font-size:13px;color:var(--muted)}
.pbi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.pbi-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.pbi-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:500px){.pbi-tiles{grid-template-columns:minmax(0,1fr)}}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .bar.g0,.legend .sw.g0{fill:var(--s-a);background:var(--s-a);opacity:1}
.chart .bar.g1,.legend .sw.g1{fill:var(--s-b);background:var(--s-b);opacity:1}
.chart .bar.g2,.legend .sw.g2{fill:var(--s-c);background:var(--s-c);opacity:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .l0{stroke:var(--s-a);fill:var(--s-a)}
.chart .l1{stroke:var(--s-b);fill:var(--s-b)}
.chart .l2{stroke:var(--s-c);fill:var(--s-c)}
.chart .ln.l0,.chart .ln.l1,.chart .ln.l2{fill:none}
.chart .ln.dash{stroke-dasharray:6 4}
.chart .ax2{font-size:12.5px}

/* signalen */
.signals{list-style:none;margin:0;padding:0}
.signal{border-left:5px solid var(--border);padding:8px 14px;margin:12px 0;background:var(--card)}
.signal.sev-high{border-left-color:var(--bad)}
.signal.sev-mid{border-left-color:var(--s-b)}
.signal.sev-low{border-left-color:var(--s-c)}
.signal h3{margin:4px 0;font-size:16px}
.signal p{margin:4px 0}
.signal .sev{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:0 6px}

/* delen en exporteren */
.export .exrow{display:flex;flex-wrap:wrap;gap:6px}
.xb,.exp{font:inherit;font-size:13px;color:var(--primary-text);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}
.xb:hover,.exp:hover{border-color:var(--primary)}
.xb:focus-visible,.exp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.exp{padding:3px 8px;font-size:12px;font-weight:600;margin-right:4px}
/* afdrukken en PDF: alleen de inhoud, geen menu en knoppen; alle onderdelen onder elkaar bij 'alles afdrukken' */
.printall{display:none}
body.print-all .shell,body.print-all .scrim,body.print-all .skip{display:none}
body.print-all .printall{display:block;padding:16px 24px;background:var(--page)}
.print-head{font-size:24px;font-weight:300;margin:0 0 12px;color:var(--primary-text)}
.print-title{font-size:20px;margin:18px 0 8px;color:var(--text);border-bottom:2px solid var(--primary);padding-bottom:4px}
@media print{
  .side,.topbar,.selpanel,.skip,.sr,.scrim,.footer,.xbtn,.tools,.crumbs,.controls,.close{display:none !important}
  html,body{background:#fff}
  .shell{display:block}.main{margin:0}.content{padding:0}
  .card,.pbi-tile,.kpi,.signal{break-inside:avoid;box-shadow:none}
  .print-view{break-before:page}
  .print-view:first-of-type{break-before:auto}
  body.print-all .printall{padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* weergave Lijnen */
.pbi-tiles.lt .pbi-tile{text-align:left;border-top:4px solid var(--s-a);border-radius:6px}
.pbi-tiles.lt .pbi-tile .v{font-size:28px;font-weight:600}
.chart .area{fill:var(--s-a);opacity:.14;stroke:none}
.chart .ln.l0{stroke-width:3}
/* weergave Donker: meters, ring, balken */
.neon-gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.neon-gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gbox .gl{text-align:center;font-size:14px;color:var(--muted)}
.g-track{fill:none;stroke:var(--border);stroke-width:14;stroke-linecap:round}
.g-val{fill:none;stroke:var(--s-a);stroke-width:14;stroke-linecap:round}
.g-num{fill:var(--text);font-size:22px;font-weight:600}
.g-sub{fill:var(--muted);font-size:10px}
.donut{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:16px;align-items:center}
.dn{fill:none;stroke-width:16}
.dn.d0,.sw.d0{stroke:var(--c0);background:var(--c0);opacity:1}.dn.d1,.sw.d1{stroke:var(--c1);background:var(--c1);opacity:1}
.dn.d2,.sw.d2{stroke:var(--c2);background:var(--c2);opacity:1}.dn.d3,.sw.d3{stroke:var(--c3);background:var(--c3);opacity:1}.dn.d4,.sw.d4{stroke:var(--c5);background:var(--c5);opacity:1}
.donut .legend{flex-direction:column;align-items:flex-start}
.hbars .hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr minmax(48px,auto);gap:10px;align-items:center;margin:8px 0}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{display:block;height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.hb-f{display:block;height:100%;background:linear-gradient(90deg,var(--s-a),var(--s-b));border-radius:6px}
.hb-v{text-align:right;font-variant-numeric:tabular-nums}
html[data-style="donker"] .chart .area{opacity:.25}

/* eigen indeling */
[hidden]{display:none !important}
.layout-editor{border:2px dashed var(--primary)}
.ly-list{list-style:none;margin:8px 0;padding:0}
.ly-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.ly-row label{flex:1}
.ly-row .xb{padding:3px 10px;min-width:36px}
.ly-row .xb:disabled{opacity:.4;cursor:default}
.ly-row input{width:18px;height:18px}
.ly-export{display:block;margin-top:10px;font-weight:600}
.ly-setting{display:block;width:100%;box-sizing:border-box;margin:4px 0;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px}

/* wereldbol */
.globe-row{display:grid;grid-template-columns:minmax(240px,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.globe-row{grid-template-columns:minmax(0,1fr)}}
canvas.globe{display:block;width:100%;height:auto;max-width:560px;touch-action:pan-y;cursor:grab;border-radius:50%}
canvas.globe:active{cursor:grabbing}
canvas.globe:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.globe-info{min-height:2.6em;font-weight:600;margin:0 0 8px}
.globe-legend{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;color:var(--muted)}
.globe-grad{display:inline-block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--border),var(--s-a))}
.globe-top{margin:8px 0;padding-left:20px}

/* reeksen 4 en 5 */
.chart .bar.g3,.legend .sw.g3{fill:var(--s-d);background:var(--s-d);opacity:1}
.chart .bar.g4,.legend .sw.g4{fill:var(--muted);background:var(--muted);opacity:1}
.chart .l3{stroke:var(--s-d);fill:var(--s-d)}.chart .l4{stroke:var(--muted);fill:var(--muted)}
.chart .ln.l3,.chart .ln.l4{fill:none}
/* meters met kleurverloop */
.g-val{stroke:var(--grad,var(--s-a))}
.gs0{stop-color:var(--s-a)}.gs1{stop-color:var(--s-b)}
/* weergave Donker: neon, diepe achtergrond, gloed */
html[data-style="donker"],html[data-style="donker"] body{background:radial-gradient(1100px 600px at 85% -10%,#2b1c63 0%,var(--page) 62%) fixed,var(--page)}
html[data-style="donker"] .card,html[data-style="donker"] .pbi-tile,html[data-style="donker"] .kpi{background:linear-gradient(160deg,#1c1842 0%,var(--card) 70%);border-color:#33306a;box-shadow:0 0 0 1px rgba(155,135,255,.08),0 8px 24px rgba(0,0,0,.35)}
html[data-style="donker"] .selpanel,html[data-style="donker"] .topbar{background:#120f2c}
html[data-style="donker"] .g-val{stroke:var(--grad);filter:drop-shadow(0 0 6px rgba(255,79,163,.7))}
html[data-style="donker"] .gs0{stop-color:var(--s-a)}html[data-style="donker"] .gs1{stop-color:var(--s-b)}

t","Korting","Gemiddelde orderwaarde","Kortingspercentage"],"cp_h_trend":"Kortingspercentage per maand","pd_intro":"Per product: hoe vaak het werd bekeken, in de winkelwagen gedaan en gekocht (aantallen uit Analytics of uit een bestand), plus omzet en retouren uit de orderregels. Producten worden aan elkaar gekoppeld op naam; een andere naam in beide bronnen geeft geen koppeling.","pd_h_table":"Producten in de gekozen periode","pd_th":["Product","Bekeken","In winkelwagen","Gekocht","Bekeken naar winkelwagen","Winkelwagen naar gekocht","Omzet","Retour","Marge"],"pd_h_flags":"Wat opvalt","pd_flag_low":"{name}: wordt vaak bekeken ({v}x) maar zelden in de winkelwagen gedaan ({r} tegenover {a} gemiddeld). Dat kan aan prijs, foto's, tekst of voorraad liggen; dit overzicht zegt niet welke.","pd_flag_ret":"{name}: {r} van de omzet is teruggestort, tegenover {a} gemiddeld. Dat zegt niet waarom; kijk naar maten, beschrijving en kwaliteit.","pd_no_flags":"Geen product valt duidelijk op: er is geen product met opvallend weinig doorgang naar de winkelwagen of opvallend veel retouren (voor producten met genoeg gegevens).","pd_flag_note":"Een product valt alleen op bij genoeg gegevens (minstens 100 keer bekeken, of minstens 20 verkochte stuks). Weinig doorgang naar de winkelwagen melden we bovendien alleen als het verschil niet aan toeval kan liggen; bij retouren is dat een vuistregel (minstens twee keer het gemiddelde).","pd_h_trend":"Verloop per maand: ","pd_trend_hint":"Klik op een product voor het verloop per maand van het aantal keer gekocht.","pd_no_data":"Voor deze keuze staan geen productgegevens in het archief.","pd_h_gauges":"Van bekeken naar winkelwagen, de grootste producten","pd_gauge_sub":"{v} bekeken","fn_intro":"Waar haken bezoekers af op weg naar een aankoop? Elke stap telt unieke bezoekers die die stap in de gekozen periode deden: een product bekeken, iets in de winkelwagen gedaan, begonnen met afrekenen en gekocht.","fn_steps":{"view_item":"Product bekeken","add_to_cart":"In winkelwagen","begin_checkout":"Begonnen met afrekenen","purchase":"Gekocht"},"fn_h_kpi":"Doorgang per stap","fn_r1":"Van product bekeken naar winkelwagen","fn_r2":"Van winkelwagen naar afrekenen","fn_r3":"Van afrekenen naar gekocht","fn_rall":"Van product bekeken naar gekocht","fn_biggest":"De grootste afhaak zit tussen “{a}” en “{b}”: {p} van de bezoekers gaat niet verder. Dit zegt niet waarom; het wijst alleen aan waar het zin heeft om te kijken.","fn_h_steps":"Bestelstappen","fn_th":["Stap","Bezoekers","Doorgang vanaf vorige stap","Vorige periode","Verschil (procentpunt)","Oordeel"],"fn_note":"Een bezoeker telt één keer per stap, ook als die in de maand meerdere keren bestelde. Een verschil met de vorige periode noemen we alleen duidelijk als het niet aan toeval kan liggen (genoeg bezoekers en een statistische toets).","fn_h_dev":"Per apparaat","fn_h_chan":"Per kanaal","fn_h_trend":"Doorgang van product bekeken naar gekocht, per maand","fn_grp_th":{"by_device":["Apparaat","Product bekeken","Naar winkelwagen","Naar afrekenen","Naar gekocht","Totaal"],"by_channel":["Kanaal","Product bekeken","Naar winkelwagen","Naar afrekenen","Naar gekocht","Totaal"]},"fn_h_missing":"Niet alle stappen komen binnen","fn_missing":"Voor deze stappen komen geen gegevens binnen: {s}. Controleer of de webshop de standaard gebeurtenissen (view_item, add_to_cart, begin_checkout, purchase) aan Analytics doorgeeft, of lever de aantallen als bestand aan.","pr_intro":"Brutowinst per product: de omzet min de inkoopprijs die de klant zelf heeft aangeleverd. Alleen producten met een inkoopprijs tellen mee.","pr_h_none":"Nog geen inkoopprijzen","pr_none":"Voor deze keuze is geen inkoopprijs bekend, dus er is nog geen winst te berekenen. Lever een lijst met inkoopprijzen aan; hieronder staan de producten met de meeste omzet.","pr_h_kpi":"Winst in de gekozen periode","pr_k_profit":"Brutowinst","pr_k_margin":"Marge","pr_k_cover":"Omzet met bekende inkoopprijs","pr_k_after_ads":"Brutowi nden"],"pc_status":{"on_track":"Op koers","close":"Net te weinig","behind":"Achter","ahead":"Voor op schema"},"pc_metrics":{"sessions":"sessies","conversions":"conversies","revenue":"omzet"},"pc_h_goal":"Voortgang van het jaardoel","pc_h_ads":"Wat als het advertentiebudget verandert? (scenario)","pc_chart":"Opgetelde voortgang","pc_actual":"Werkelijk","pc_path":"Doelpad","pc_proj":"Verwachting","pc_ads_hint":"Een rekensom, geen voorspelling: we nemen aan dat extra advertentiegeld {eff} oplevert van wat het gemiddelde rendement van de laatste 3 maanden is (extra geld werkt meestal minder goed dan het eerste).","pc_ads_th":["Kanaal","Kosten per maand","Omzet per maand","Rendement","Scenario","Extra kosten","Extra omzet (aanname)"],"pc_ads_none":"Er zijn geen advertentiekosten bekend in de laatste 3 maanden.","pc_note":"De verwachting is een eenvoudige hochrekening (tot nu toe gedeeld door het deel van het jaar dat meestal al voorbij is) met een grove bandbreedte; ze houdt geen rekening met geplande campagnes. De scenario's hangen af van de aanname.","pc_range":"bandbreedte {lo} tot {hi}","sm_title":"Samenvatting van het bureau","sm_by":"Geschreven met {via} en gecontroleerd door het bureau op {d}.","sm_via":{"ai":"een taalmodel","regels":"vaste regels"},"n_actions":"Acties","ac_intro":"Wat is er aan gedaan, en wat leverde het op? Een actie wordt pas beoordeeld als er minstens twee volle maanden na zijn.","ac_th":["Actie","Soort","Doel","Status","Klaar op","Uitleg"],"ac_none":"Er zijn nog geen acties vastgelegd.","ac_open_n":"Open: {n}","ac_done_n":"Uitgevoerd: {n}","ac_signal_n":"Met een aanwijzing voor effect: {n}","ac_note":"De beoordeling vergelijkt de maanden na de actie met de maanden ervoor en, als die er zijn, met dezelfde maanden vorig jaar. Het toont wat er gebeurde, niet zeker waarom.","ac_kinds":{"pagina":"Pagina","content":"Inhoud","advertenties":"Advertenties","tracking":"Meting","kanaal":"Kanaal","overig":"Overig"},"ac_goals":{"sessies":"sessies","conver maal 15 landen, {n} in deze periode).","in_th_geo":["Land","Sessies","Aandeel","Verschil","Conversies","Conversie"],"in_geo_spread":"Het bezoek komt uit veel verschillende landen. Als je alleen in een deel van die landen levert, is dat bezoek weinig waard.","in_geo_note":"Landnamen komen zoals Analytics ze geeft. Het aandeel is tegenover alle sessies van de periode; landen buiten de lijst staan er niet bij.","in_h_speed":"Hoe snel is de site voor echte bezoekers?","in_speed_hint":"Gemeten door echte Chrome-bezoekers (Chrome UX Report, laatste 28 dagen, 75e percentiel). Goed is: laden hoofdinhoud tot 2,5 s, reactietijd tot 200 ms, verspringen tot 0,1.","in_th_speed":["Maand","Apparaat","Laden hoofdinhoud (LCP)","Reactietijd (INP)","Verspringen (CLS)"],"in_sp_good":"Goed","in_sp_mid":"Kan beter","in_sp_bad":"Slecht","in_speed_note":"Alleen maanden waarin we de snelheid hebben opgehaald staan hier; die gegevens zijn niet terug te halen voor het verleden. Heeft een site te weinig Chrome-verkeer, dan geeft Google geen cijfers.","in_h_products":"Welke producten verkopen het best?","in_products_hint":"De bestverkochte producten van de gekozen periode, op omzet.","in_th_products":["Product","Aantal","Omzet","Aandeel omzet","Verschil omzet"],"in_prod_concentrated":"De drie bestsellers brengen {p} van de productomzet. Voorraad en vindbaarheid van juist die producten zijn belangrijk.","in_products_note":"Alleen als de webshop productgegevens naar Analytics stuurt. Het aandeel is binnen de getoonde producten (maximaal 20 per maand); omzet die niet aan een product hangt (bijvoorbeeld verzendkosten) telt hier niet mee.","in_h_weekday":"Welke dagen van de week werken het best?","in_weekday_hint":"Bezoek en conversie per dag van de week, opgeteld over de gekozen periode.","in_th_weekday":["Dag","Sessies","Aandeel sessies","Conversies","Conversie","Tegenover de rest"],"in_days":{"1":"Maandag","2":"Dinsdag","3":"Woensdag","4":"Donderdag","5":"Vrijdag","6":"Zaterdag","0":"Zondag"},"in_weekday_note":"Een dag staat er alleen als beter of slechter bij als de toets (z \u003e= 3), minstens 200 sessies en een factor 1,5 dat steunen. Het aantal dagen per soort verschilt per maand, daarom zijn de aandelen bij korte periodes bij benadering.","in_h_engagement":"Hoe betrokken zijn bezoekers per kanaal?","in_engagement_hint":"Aandeel sessies waarin iemand echt iets deed (minstens 10 seconden, een conversie of twee paginaweergaven) en de gemiddelde actieve tijd per betrokken sessie.","in_th_engagement":["Kanaal","Sessies","Betrokken","Actieve tijd per betrokken sessie"],"in_low_engagement":"Bezoek via {name} is veel minder betrokken ({p}) dan de rest: veel mensen haken meteen af. Kijk of de pagina bij de advertentie of link past.","in_engagement_note":"Betrokken is de definitie van Analytics (GA4). Een lage betrokkenheid is niet altijd een probleem: een snel antwoord op een eenvoudige vraag is ook een geslaagd bezoek.","in_h_ads":"Advertenties: kosten en rendement","in_ads_hint":"Wat er aan betaalde advertenties is uitgegeven en wat die kanalen opleverden, in de gekozen periode.","in_th_ads":["Kanaal","Kosten","Verschil","Klikken","Per klik","Conversies","Per conversie","Omzet","Rendement"],"in_ads_warn":"Let op: {names} brengt minder omzet op dan het kost (nog zonder inkoopkosten). Dat kan toch zinvol zijn, bijvoorbeeld voor nieuwe klanten, maar het is de moeite waard om na te gaan.","in_ads_note":"Kosten staan er alleen als Analytics ze kent (Google Ads gekoppeld of kosten geimporteerd). Rendement is de omzet van het kanaal gedeeld door de kosten; het telt ook omzet mee die er zonder advertentie misschien ook was gekomen. De waarschuwing komt alleen bij minstens 100 euro kosten en 10 conversies.","in_h_changes":"Wat is er veranderd aan de site of campagne?","in_changes_none":"In de gekozen periode staan geen wijzigingen genoteerd.","in_changes_hint":"Wijzigingen die het bureau heeft genoteerd, met de conversie in de maand ervoor en in de maand van de wijziging.","in_th_changes":["Datum","Wijziging","Conversie maand ervoor","Conversie maand van wijziging","Verschil"],"in_pp":"procentpunt","in_changes_note":"Dit laat zien wat er rond een wijziging gebeurde, het bewijst niet dat de wijziging de oorzaak is: seizoen, campagnes en toeval spelen ook mee. Een maand is te grof om het precieze effect van een wijziging te meten.","in_h_search":"Wat zoeken bezoekers op de site?","in_search_hint":"De meest gebruikte zoektermen in het zoekveld van de site in de gekozen periode.","in_th_search":["Zoekterm","Sessies","Verschil","Conversies","Conversie"],"in_search_note":"Alleen als de site zoekopdrachten naar Analytics stuurt. Termen met een @ of een lange cijferreeks laten we weg omdat ze persoonsgegevens kunnen bevatten. Veel gezochte termen die je niet verkoopt of niet goed vindbaar hebt, zijn kansen.","gl_title":"Wereldbol: waar komen bezoekers vandaan?","gl_hint":"Sleep de bol om te draaien of gebruik de pijltoetsen. Klik op een land voor de cijfers. Hoe donkerder, hoe meer bezoek.","gl_label":"Wereldbol met bezoek per land","gl_sessions":"sessies","gl_none":"geen bezoek bij de grootste landen","gl_left":"Draai naar links","gl_right":"Draai naar rechts","gl_up":"Draai omhoog","gl_down":"Draai omlaag","gl_home":"Naar {c}","gl_spin":"Automatisch draaien","gl_less":"Minder","gl_more":"Meer bezoek","gl_unmatched":"{n} land(en) staan niet op de kaart; ze staan wel in de tabel hieronder.","gl_note":"Kaart: Natural Earth (publiek domein), op een schaal waarop kleine landen ontbreken; die staan als stip. Analytics geeft hier de grootste 15 landen, andere landen zijn grijs. Grenzen en namen zijn geen politieke uitspraak.","in_h_goals":"Doelen tegenover werkelijkheid","in_goals_hint":"Het doel per maand maal het aantal maanden met gegevens in de gekozen periode ({n}).","in_th_goals":["Meetwaarde","Doel per maand","Doel voor de periode","Werkelijk","Behaald","Stand"],"in_goal_met":"Doel gehaald","in_goal_open":"Nog {p} te gaan","in_goals_note":"De doelen zijn door het bureau ingesteld; het dashboard rekent ze niet zelf uit. Een doel dat gehaald is, zegt niets over de reden.","in_h_channels":"Waar komt kwaliteit vandaan? Kanalen","in_channels_hint":"Aandeel in bezoek tegenover aandeel in conversies, en het conversiepercentage per kanaal.","in_th_channels":["Kanaal","Sessies","Aandeel sessies","Conversies","Aandeel conversies","Conversie","Tegenover de rest"],"in_better":"Duidelijk beter","in_worse":"Duidelijk slechter","in_depend":"{p} van het bezoek komt via {name}. Valt dat kanaal weg, dan valt veel bezoek weg.","in_channels_note":"'Duidelijk beter of slechter' staat er alleen bij minstens 200 sessies per kant, 20 conversies samen, een verschil van minstens 1,5 keer en een toets waarbij toeval vrijwel is uitgesloten. Kanalen die niets noemen, verschillen niet aantoonbaar.","in_h_pages":"Hoe afhankelijk zijn we van weinig pagina's?","in_th_pages":["Pagina","Sessies","Aandeel sessies","Conversies","Aandeel conversies"],"in_top5":"Top 5 samen","in_concentrated":"De vijf grootste pagina's brengen {p} van het bezoek. Een storing of een lagere positie op een van die pagina's raakt het hele resultaat.","in_pages_note":"Gebaseerd op de bestemmingspagina's waar het bezoek begon (de bekende top van de lijst); aandelen zijn tegenover alle sessies en conversies van de periode.","in_h_brand":"Merk tegenover niet-merk in Google","in_brand_hint":"Merkzoekopdrachten bevatten: {terms}. Alles anders telt als niet-merk.","in_th_brand":["Soort","Klikken","Aandeel","Verschil","Vertoningen"],"in_brand":"Merk","in_nonbrand":"Niet-merk","in_nb_up":"Klikken op niet-merk zoektermen zijn {p} gestegen: er komen meer nieuwe mensen via Google.","in_nb_down":"Klikken op niet-merk zoektermen zijn {p} gedaald: er komen minder nieuwe mensen via Google.","in_brand_note":"Merk of niet-merk wordt bepaald door of de zoekterm een van de genoemde woorden bevat; schrijfvarianten of typefouten kunnen ontbreken. Alleen de bekende zoektermen
